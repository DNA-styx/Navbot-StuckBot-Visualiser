<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbot StuckBot Visualiser v1.2</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { margin-bottom: 0.5rem; color: var(--primary); }
        .header p { color: #64748b; margin-top: 0; }

        .drop-zone {
            border: 3px dashed var(--border);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            background: var(--card);
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .results-area { display: none; margin-top: 2rem; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-label { display: block; color: #64748b; font-size: 0.875rem; font-weight: 500; text-transform: uppercase; }
        .stat-value { display: block; font-size: 2.25rem; font-weight: 800; color: var(--primary); }

        .map-summary {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .map-summary th, .map-summary td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .map-summary th { background: #f1f5f9; font-weight: 600; color: #475569; }
        .map-summary tr:last-child td { border-bottom: none; }
        .map-summary tr:hover { background: #f8fafc; }

        .warning-box {
            background: #fff7ed;
            border: 1px solid #ffedd5;
            color: #9a3412;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }
        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .download-btn { background: var(--primary); color: white; flex: 2; }
        .download-btn:hover { background: var(--primary-hover); }
        .reset-btn { background: #e2e8f0; color: #475569; flex: 1; }
        .reset-btn:hover { background: #cbd5e1; }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Navbot StuckBot Visualiser</h1>
        <p>Log Analysis & KeyValues Generator • v1.2</p>
    </div>

    <div id="dropZone" class="drop-zone">
        <p><strong>Drop SourceMod Log File Here</strong></p>
        <span style="color: #64748b;">or click to browse</span>
        <input type="file" id="fileInput" accept=".log,.txt">
    </div>

    <div id="resultsArea" class="results-area">
        <div id="restartWarning" class="warning-box">
            <strong>Notice:</strong> Server restarts detected. Data between a restart and the next map change was discarded for accuracy.
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Event Count</span>
                <span id="botCount" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Map Count</span>
                <span id="mapCount" class="stat-value">0</span>
            </div>
        </div>

        <h3>Map Breakdown</h3>
        <table class="map-summary">
            <thead>
                <tr>
                    <th>Map Name</th>
                    <th>Stuck Events</th>
                </tr>
            </thead>
            <tbody id="mapTableBody">
                </tbody>
        </table>

        <div class="btn-group">
            <button id="downloadBtn" class="download-btn">Download locations.txt</button>
            <button id="resetBtn" class="reset-btn">Clear & Restart</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultsArea = document.getElementById('resultsArea');
        const mapTableBody = document.getElementById('mapTableBody');
        const restartWarning = document.getElementById('restartWarning');
        
        let generatedKV = '';

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });
        document.getElementById('resetBtn').addEventListener('click', () => location.reload());

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => processLog(e.target.result);
            reader.readAsText(file);
        }

        function processLog(rawText) {
            const lines = rawText.split(/\r?\n/);
            const bots = [];
            const mapStats = {}; 
            let currentMap = "Unknown_Map";
            let isMapValid = true; 
            let restartDetected = false;

            const initMarkers = [
                "CBasePlayer::PlayerRunCommand hook enabled",
                "Loaded bot difficulty profiles",
                "Extension fully loaded",
                "Registered 34 natives"
            ];

            lines.forEach(line => {
                if (line.length < 28) return;
                const msgPos = line.indexOf(': ');
                if (msgPos === -1) return;
                const content = line.substring(msgPos + 2);

                if (initMarkers.some(m => content.includes(m))) {
                    isMapValid = false;
                    restartDetected = true;
                    return;
                }

                if (content.includes('Changed map to') || content.includes('Mapchange to')) {
                    const mapMatch = content.match(/Mapchange to ([\w_]+)|Changed map to "([\w_]+)"/);
                    if (mapMatch) {
                        currentMap = mapMatch[1] || mapMatch[2];
                        isMapValid = true;
                    }
                    return;
                }

                if (isMapValid && content.includes('[NavBot] Bot') && content.includes('suicided')) {
                    const coordMatch = content.match(/suicided.* ([\-\d\.]+) ([\-\d\.]+) ([\-\d\.]+)/);
                    if (coordMatch) {
                        bots.push({ map: currentMap, x: coordMatch[1], y: coordMatch[2], z: coordMatch[3] });
                        mapStats[currentMap] = (mapStats[currentMap] || 0) + 1;
                    }
                }
            });

            renderUI(bots, mapStats, restartDetected);
        }

        function renderUI(bots, mapStats, showedWarning) {
            const sortedMaps = Object.entries(mapStats).sort((a, b) => b[1] - a[1]);

            mapTableBody.innerHTML = sortedMaps.map(([name, count]) => `
                <tr>
                    <td><code>${name}</code></td>
                    <td><strong>${count}</strong></td>
                </tr>
            `).join('');

            document.getElementById('botCount').textContent = bots.length;
            document.getElementById('mapCount').textContent = sortedMaps.length;
            restartWarning.style.display = showedWarning ? 'block' : 'none';
            dropZone.style.display = 'none';
            resultsArea.style.display = 'block';

            let kv = '"StuckBots"\n{\n';
            bots.forEach((bot, i) => {
                kv += `    "${i}"\n    {\n`;
                kv += `        "map"    "${bot.map}"\n`;
                kv += `        "x"      "${bot.x}"\n`;
                kv += `        "y"      "${bot.y}"\n`;
                kv += `        "z"      "${bot.z}"\n`;
                kv += `    }\n`;
            });
            kv += '}\n';
            generatedKV = kv;
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const blob = new Blob([generatedKV], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'locations.txt';
            link.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
